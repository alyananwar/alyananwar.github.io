<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Y2K chrome: bright sky above a hard horizon, warm steel below -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fafd"/>
      <stop offset="0.28" stop-color="#c3cedb"/>
      <stop offset="0.47" stop-color="#7d8896"/>
      <stop offset="0.5" stop-color="#39404a"/>
      <stop offset="0.54" stop-color="#aeb9c6"/>
      <stop offset="0.76" stop-color="#e8eef5"/>
      <stop offset="1" stop-color="#96a1ae"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#525a64"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#131316"/>
  <text x="50" y="76" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="url(#chrome)" stroke="url(#edge)" stroke-width="1.5" text-anchor="middle">A</text>
</svg>
